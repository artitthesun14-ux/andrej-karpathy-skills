<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Visual Style Library</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Anton&family=Archivo:wght@400;600;800&family=Bodoni+Moda:ital,wght@0,400;0,700;1,400&family=Caveat:wght@500&family=EB+Garamond:ital,wght@0,400;0,600;1,400&family=IBM+Plex+Mono:wght@400;500&family=Jost:wght@400;600&family=Poiret+One&family=Zilla+Slab:wght@500;700&display=swap">
<style>
/* Layout: a working index, filter rail above a dense card grid; specimens carry the color, the chrome stays quiet. */
:root {
  --bg: #F4F3EF;
  --panel: #FFFFFF;
  --ink: #1B1C1F;
  --muted: #5D5F66;
  --rule: #DAD8D1;
  --accent: #23408E;
  --ok: #1F6B3A;
  --warn: #8A5300;
  --bad: #A3241A;
  --chip: #ECEAE4;
  --f-ui: 'Archivo', 'Helvetica Neue', Arial, sans-serif;
  --f-display: 'Bodoni Moda', 'Didot', 'Bodoni 72', Georgia, serif;
  --f-mono: 'IBM Plex Mono', ui-monospace, Menlo, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #131417; --panel: #1C1D22; --ink: #ECEBE6; --muted: #A3A4AB; --rule: #33353C;
    --accent: #9DB4F2; --ok: #7ACB93; --warn: #E7B45C; --bad: #F08A80; --chip: #26282E; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #131417; --panel: #1C1D22; --ink: #ECEBE6; --muted: #A3A4AB; --rule: #33353C;
  --accent: #9DB4F2; --ok: #7ACB93; --warn: #E7B45C; --bad: #F08A80; --chip: #26282E; color-scheme: dark;
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--ink); font: 15px/1.5 var(--f-ui); }
.wrap { max-width: 1320px; margin: 0 auto; padding-inline: max(16px, 3vw); padding-block: 28px 64px; }
header.top { display: flex; flex-wrap: wrap; align-items: baseline; justify-content: space-between; gap: 8px 24px; border-bottom: 1px solid var(--rule); padding-bottom: 16px; }
h1 { font: italic 400 clamp(30px, 4vw, 44px)/1.05 var(--f-display); margin: 0; letter-spacing: -0.01em; }
.lede { color: var(--muted); margin: 6px 0 0; max-width: 62ch; }
.counts { font: 500 12px/1.4 var(--f-mono); color: var(--muted); }
nav.tabs { display: flex; gap: 4px; margin: 20px 0 12px; flex-wrap: wrap; }
nav.tabs button { font: 600 13px var(--f-ui); letter-spacing: 0.04em; text-transform: uppercase; padding: 8px 14px; border: 1px solid var(--rule); background: transparent; color: var(--muted); border-radius: 999px; cursor: pointer; }
nav.tabs button[aria-selected="true"] { background: var(--ink); color: var(--bg); border-color: var(--ink); }
.filters { display: grid; grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); gap: 8px; margin-bottom: 8px; }
.filters label { display: grid; gap: 2px; font: 600 11px var(--f-ui); letter-spacing: 0.06em; text-transform: uppercase; color: var(--muted); min-width: 0; }
.filters input, .filters select { font: 400 14px var(--f-ui); padding: 7px 8px; border: 1px solid var(--rule); border-radius: 6px; background: var(--panel); color: var(--ink); width: 100%; min-width: 0; }
.filters .search { grid-column: span 2; }
@media (max-width: 420px) { .filters .search { grid-column: auto; } }
.status { font: 500 12px var(--f-mono); color: var(--muted); margin: 8px 0 16px; display: flex; gap: 12px; flex-wrap: wrap; align-items: center; }
.status button { font: 500 12px var(--f-mono); background: none; border: 0; color: var(--accent); cursor: pointer; padding: 0; text-decoration: underline; }
.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(270px, 1fr)); gap: 16px; }
.card { background: var(--panel); border: 1px solid var(--rule); border-radius: 10px; overflow: hidden; display: flex; flex-direction: column; min-width: 0; }
.thumb { position: relative; aspect-ratio: 16 / 10; max-width: 100%; border-bottom: 1px solid var(--rule); }
.thumb svg { display: block; width: 100%; height: 100%; }
.tag-synth { position: absolute; right: 6px; top: 6px; font: 500 10px var(--f-mono); padding: 2px 6px; border-radius: 4px; background: rgba(0,0,0,.55); color: #fff; letter-spacing: 0.02em; }
.body { padding: 12px 14px 14px; display: grid; gap: 8px; flex: 1; align-content: start; }
.eyebrow { font: 600 11px var(--f-ui); letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted); }
.card h3 { margin: 0; font: 600 18px/1.2 var(--f-ui); text-wrap: balance; }
.summary { margin: 0; color: var(--muted); font-size: 14px; }
.swatches { display: flex; height: 18px; border-radius: 4px; overflow: hidden; border: 1px solid var(--rule); }
.swatches span { display: block; height: 100%; }
.specimen { display: flex; align-items: baseline; gap: 10px; min-width: 0; overflow: hidden; white-space: nowrap; }
.specimen .d { font-size: 26px; line-height: 1; }
.specimen .t { font-size: 13px; color: var(--muted); overflow: hidden; text-overflow: ellipsis; }
.actions { display: flex; gap: 8px; margin-top: 4px; flex-wrap: wrap; }
.btn { font: 600 13px var(--f-ui); padding: 7px 12px; border-radius: 6px; border: 1px solid var(--rule); background: transparent; color: var(--ink); cursor: pointer; }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--panel); }
.btn:focus-visible, nav.tabs button:focus-visible, .filters :focus-visible, .linkish:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.chips { display: flex; gap: 4px; flex-wrap: wrap; }
.chip { font: 500 11px var(--f-mono); padding: 2px 6px; border-radius: 4px; background: var(--chip); color: var(--muted); }
.empty { padding: 40px 0; color: var(--muted); }
.notice { background: var(--panel); border: 1px solid var(--rule); border-left: 4px solid var(--warn); padding: 16px; border-radius: 6px; }
.notice code { font-family: var(--f-mono); }
/* palettes */
.pcard .bar { display: flex; height: 64px; }
.pcard .bar span { display: block; height: 100%; }
.colors { display: grid; gap: 4px; font-size: 13px; }
.colors div { display: grid; grid-template-columns: 14px 76px 1fr auto; gap: 8px; align-items: center; }
.colors i { width: 14px; height: 14px; border-radius: 3px; border: 1px solid var(--rule); display: block; }
.colors code, .pairs code { font: 500 12px var(--f-mono); }
.colors .role { color: var(--muted); font: 500 11px var(--f-mono); }
.pairs { display: grid; gap: 4px; font-size: 13px; }
.pair { display: grid; grid-template-columns: 34px 1fr auto; gap: 8px; align-items: center; }
.pair .demo { font: 700 13px var(--f-ui); text-align: center; border-radius: 4px; padding: 2px 0; }
.badge { font: 600 11px var(--f-mono); padding: 1px 6px; border-radius: 4px; white-space: nowrap; }
.badge.ok { color: var(--ok); border: 1px solid currentColor; }
.badge.warn { color: var(--warn); border: 1px solid currentColor; }
.badge.bad { color: var(--bad); border: 1px solid currentColor; }
.checker { background: var(--panel); border: 1px solid var(--rule); border-radius: 10px; padding: 14px; margin-bottom: 16px; display: flex; flex-wrap: wrap; gap: 12px; align-items: end; }
.checker label { display: grid; gap: 2px; font: 600 11px var(--f-ui); letter-spacing: 0.06em; text-transform: uppercase; color: var(--muted); }
.checker input[type="text"] { font: 500 14px var(--f-mono); width: 110px; padding: 6px 8px; border: 1px solid var(--rule); border-radius: 6px; background: var(--bg); color: var(--ink); }
.checker input[type="color"] { width: 40px; height: 34px; border: 1px solid var(--rule); border-radius: 6px; padding: 2px; background: var(--bg); }
.checker .sample { padding: 8px 14px; border-radius: 6px; font-weight: 600; border: 1px solid var(--rule); }
.checker .result { font: 500 14px var(--f-mono); }
/* dialog */
dialog { border: 1px solid var(--rule); border-radius: 12px; padding: 0; width: min(760px, calc(100vw - 32px)); max-height: calc(100vh - 48px); background: var(--panel); color: var(--ink); }
dialog::backdrop { background: rgba(10, 10, 12, .5); }
.dlg { padding: 20px 22px 24px; display: grid; gap: 14px; }
.dlg header { display: flex; justify-content: space-between; gap: 12px; align-items: start; }
.dlg h2 { margin: 0; font: 400 30px/1.1 var(--f-display); }
.dlg .meta { display: grid; grid-template-columns: max-content 1fr; gap: 4px 14px; font-size: 13px; }
.dlg .meta dt { color: var(--muted); font: 600 11px var(--f-ui); letter-spacing: 0.06em; text-transform: uppercase; padding-top: 2px; }
.dlg .meta dd { margin: 0; min-width: 0; }
.profile { display: grid; gap: 10px; }
.profile div h4 { margin: 0 0 2px; font: 600 11px var(--f-ui); letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted); }
.profile div p { margin: 0; max-width: 72ch; }
.linkish { font: inherit; background: none; border: 0; padding: 0; color: var(--accent); cursor: pointer; text-decoration: underline; text-underline-offset: 2px; }
pre.snippet { font: 500 12.5px/1.5 var(--f-mono); background: var(--bg); border: 1px solid var(--rule); border-radius: 8px; padding: 12px; overflow-x: auto; margin: 0; white-space: pre; }
.row { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
.row select { font: 400 14px var(--f-ui); padding: 7px 8px; border: 1px solid var(--rule); border-radius: 6px; background: var(--bg); color: var(--ink); max-width: 100%; }
.copied { font: 500 12px var(--f-mono); color: var(--ok); }
@media (prefers-reduced-motion: no-preference) { .card { transition: border-color .15s; } .card:hover { border-color: var(--muted); } }
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <div>
      <h1>Visual Style Library</h1>
      <p class="lede">Styles and palettes are separate systems. Filter, open a profile, then pick a style and a palette for the work. Previews are synthetic sketches drawn from each style's layout pattern and palette, not reference images.</p>
    </div>
    <div class="counts" id="counts"></div>
  </header>

  <nav class="tabs" role="tablist" aria-label="Library sections">
    <button role="tab" id="tab-styles" aria-selected="true" data-tab="styles">Styles</button>
    <button role="tab" id="tab-palettes" aria-selected="false" data-tab="palettes">Palettes</button>
    <button role="tab" id="tab-presets" aria-selected="false" data-tab="presets">Presets</button>
  </nav>

  <section id="view-styles">
    <div class="filters" id="filters">
      <label class="search">Style<input id="f-text" type="search" placeholder="Name, alias, mood, use case"></label>
      <label>Category<select id="f-category"></select></label>
      <label>Color<select id="f-color"></select></label>
      <label>Mood<select id="f-mood"></select></label>
      <label>Typography<select id="f-typography"></select></label>
      <label>Layout<select id="f-layout"></select></label>
      <label>Medium<select id="f-medium"></select></label>
      <label>Use case<select id="f-use"></select></label>
      <label>Motion<select id="f-motion"></select></label>
    </div>
    <div class="status"><span id="style-count"></span><button type="button" id="reset">Clear filters</button></div>
    <div class="grid" id="style-grid"></div>
  </section>

  <section id="view-palettes" hidden>
    <div class="checker" aria-label="Contrast checker">
      <label>Text<span class="row"><input type="color" id="c-fg-pick" value="#1B1C1F" aria-label="Text color picker"><input type="text" id="c-fg" value="#1B1C1F" aria-label="Text color HEX"></span></label>
      <label>Background<span class="row"><input type="color" id="c-bg-pick" value="#F6F1E4" aria-label="Background color picker"><input type="text" id="c-bg" value="#F6F1E4" aria-label="Background color HEX"></span></label>
      <div class="sample" id="c-sample">Sample text Aa</div>
      <div class="result" id="c-result" aria-live="polite"></div>
    </div>
    <div class="filters">
      <label class="search">Palette<input id="p-text" type="search" placeholder="Name, color, mood"></label>
      <label>Category<select id="p-category"></select></label>
    </div>
    <div class="status"><span id="palette-count"></span></div>
    <div class="grid" id="palette-grid"></div>
  </section>

  <section id="view-presets" hidden>
    <div class="grid" id="preset-grid"></div>
  </section>
</div>

<dialog id="dlg" aria-labelledby="dlg-title"><div class="dlg" id="dlg-body"></div></dialog>

<script>
(() => {
  const $ = (s) => document.querySelector(s);
  const esc = (s) => String(s).replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
  const FONTS = {
    didone: "'Bodoni Moda', Didot, 'Bodoni 72', serif",
    garalde: "'EB Garamond', Garamond, 'Times New Roman', serif",
    grotesk: "'Archivo', 'Helvetica Neue', Arial, sans-serif",
    geometric: "'Jost', Futura, 'Century Gothic', sans-serif",
    condensed: "'Anton', Impact, 'Arial Narrow', sans-serif",
    mono: "'IBM Plex Mono', ui-monospace, Menlo, monospace",
    slab: "'Zilla Slab', Rockwell, serif",
    hand: "'Caveat', 'Bradley Hand', cursive",
    deco: "'Poiret One', Futura, sans-serif",
  };
  const THRESH = { body: 4.5, large: 3, ui: 3 };
  let DB = null;
  const state = { tab: "styles", paletteOverride: {} };

  // ---------- color ----------
  function lum(hex) {
    const h = hex.replace("#", "");
    const f = h.length === 3 ? [...h].map((c) => c + c).join("") : h;
    const [r, g, b] = [0, 2, 4].map((i) => { const c = parseInt(f.slice(i, i + 2), 16) / 255; return c <= 0.04045 ? c / 12.92 : ((c + 0.055) / 1.055) ** 2.4; });
    return 0.2126 * r + 0.7152 * g + 0.0722 * b;
  }
  function ratio(a, b) { const [x, y] = [lum(a), lum(b)].sort((p, q) => q - p); return (x + 0.05) / (y + 0.05); }
  function badge(r, use) {
    if (r >= THRESH[use || "body"] && r >= 7) return `<span class="badge ok">${r.toFixed(2)} AAA</span>`;
    if (r >= 4.5) return `<span class="badge ok">${r.toFixed(2)} AA</span>`;
    if (r >= 3) return `<span class="badge warn">${r.toFixed(2)} large only</span>`;
    return `<span class="badge bad">${r.toFixed(2)} fails</span>`;
  }
  function roles(p) {
    const by = (...rs) => { for (const r of rs) { const c = p.colors.find((x) => x.role === r); if (c) return c.hex; } return p.colors[0].hex; };
    return { bg: by("background"), fg: by("text"), pri: by("primary", "accent", "text"), acc: by("accent", "signal", "primary"),
      sec: by("secondary", "surface", "line", "text-muted"), sur: by("surface", "secondary", "line"), mut: by("text-muted", "line", "secondary", "surface") };
  }

  // ---------- synthetic previews (320 x 200) ----------
  const T = (x, y, s, fill, fam, txt, extra = "") => `<text x="${x}" y="${y}" font-size="${s}" fill="${fill}" font-family="${fam}" ${extra}>${txt}</text>`;
  const L = (n, x, y, w, gap, h, fill) => Array.from({ length: n }, (_, i) => `<rect x="${x}" y="${y + i * gap}" width="${i === n - 1 ? w * 0.6 : w}" height="${h}" fill="${fill}"/>`).join("");
  const frames = (c, f, draw) => [0, 1, 2].map((i) => `<g transform="translate(${14 + i * 102},44)"><rect width="88" height="112" rx="4" fill="${c.sur}" opacity=".35"/>${draw(i)}</g>`).join("") +
    `<path d="M104 100h8M206 100h8" stroke="${c.fg}" stroke-width="2"/>${T(14, 30, 11, c.fg, f.t, "frame 1 → 3", 'letter-spacing="1"')}`;
  const R = {
    editorial: (c, f) => `${T(18, 70, 34, c.fg, f.d, "Lumière")}<rect x="18" y="82" width="70" height="1" fill="${c.acc}"/>${L(4, 18, 96, 110, 9, 3, c.mut)}<rect x="178" y="22" width="124" height="156" fill="${c.sec}"/><rect x="178" y="22" width="124" height="156" fill="${c.fg}" opacity=".18"/>`,
    cover: (c, f) => `<rect width="320" height="200" fill="${c.sec}"/><ellipse cx="200" cy="200" rx="70" ry="110" fill="${c.fg}" opacity=".55"/><circle cx="200" cy="74" r="26" fill="${c.fg}" opacity=".7"/>${T(16, 58, 50, c.bg, f.d, "MODE", 'font-weight="700" letter-spacing="-1"')}${T(16, 150, 11, c.bg, f.t, "THE SPRING ISSUE", 'letter-spacing="2"')}${T(16, 168, 11, c.bg, f.t, "40 LOOKS")}`,
    concept: (c, f) => `<circle cx="214" cy="100" r="54" fill="${c.acc}"/><rect x="211" y="34" width="6" height="18" fill="${c.fg}"/>${T(22, 92, 22, c.fg, f.d, "Fresh ideas")}${T(22, 116, 22, c.fg, f.d, "keep", 'font-style="italic"')}${L(3, 22, 136, 90, 8, 3, c.mut)}`,
    product: (c, f) => `<radialGradient id="pg"><stop offset="0" stop-color="${c.sur}"/><stop offset="1" stop-color="${c.bg}"/></radialGradient><rect width="320" height="200" fill="url(#pg)"/><ellipse cx="160" cy="156" rx="52" ry="7" fill="${c.fg}" opacity=".18"/><rect x="132" y="46" width="56" height="104" rx="10" fill="${c.pri}"/><rect x="140" y="54" width="10" height="88" rx="5" fill="${c.fg}" opacity=".12"/>${T(160, 186, 11, c.fg, f.t, "Made to last", 'text-anchor="middle" letter-spacing="1"')}`,
    plate: (c, f) => `<rect x="104" y="20" width="112" height="128" fill="${c.sec}"/><rect x="116" y="32" width="88" height="104" fill="${c.pri}" opacity=".5"/>${T(104, 166, 10, c.fg, f.t, "Untitled (Blue), 1962", 'font-style="italic"')}${T(104, 180, 9, c.mut, f.t, "Oil on canvas, 120 × 98 cm")}`,
    grid: (c, f) => Array.from({ length: 6 }, (_, i) => `<rect x="${16 + i * 50}" y="0" width="0.6" height="200" fill="${c.mut}" opacity=".35"/>`).join("") + `${T(16, 64, 40, c.fg, f.d, "Raster", 'font-weight="800" letter-spacing="-1"')}<rect x="166" y="90" width="98" height="98" fill="${c.acc}"/>${L(5, 16, 96, 130, 9, 3, c.fg)}${T(166, 82, 10, c.fg, f.t, "Nr. 07")}`,
    diagonal: (c, f) => `<g transform="rotate(-24 160 100)"><rect x="-30" y="84" width="380" height="34" fill="${c.acc}"/>${T(20, 76, 38, c.fg, f.d, "FORWARD")}<rect x="40" y="128" width="200" height="10" fill="${c.fg}"/></g><circle cx="262" cy="52" r="22" fill="${c.fg}"/>`,
    raw: (c, f) => `<rect x="10" y="10" width="300" height="180" fill="none" stroke="${c.fg}"/><path d="M10 40h300M160 40v150M10 120h150" stroke="${c.fg}"/>${T(16, 30, 13, c.fg, f.d, "INDEX.TXT / 2026")}${T(16, 60, 11, c.fg, f.t, "01 manifesto")}${T(16, 76, 11, c.fg, f.t, "02 archive")}${T(16, 92, 11, c.acc, f.t, "03 contact", 'text-decoration="underline"')}${T(166, 70, 40, c.fg, f.d, "RAW")}${T(16, 150, 11, c.mut, f.t, "img_0423.jpg 1200x800")}`,
    geometric: (c, f) => `<circle cx="104" cy="96" r="58" fill="${c.pri}"/><rect x="164" y="40" width="74" height="74" fill="${c.sec}"/><path d="M200 168 L258 168 L229 118 Z" fill="${c.acc}"/>${T(20, 186, 14, c.fg, f.d, "form und farbe")}`,
    symmetric: (c, f) => `<rect x="20" y="14" width="280" height="172" fill="none" stroke="${c.acc}"/><path d="M128 120 v-40 a32 32 0 0 1 64 0 v40 z" fill="${c.pri}"/>${T(160, 46, 16, c.fg, f.d, "M U S E V M", 'text-anchor="middle"')}<rect x="130" y="128" width="60" height="1" fill="${c.acc}"/>${L(2, 112, 142, 96, 8, 3, c.mut)}`,
    triangle: (c, f) => `<radialGradient id="tg" cx=".5" cy=".42" r=".5"><stop offset="0" stop-color="${c.acc}" stop-opacity=".9"/><stop offset="1" stop-color="${c.bg}" stop-opacity="0"/></radialGradient><rect width="320" height="200" fill="${c.bg}"/><rect width="320" height="200" fill="url(#tg)"/><path d="M160 46 L232 170 L88 170 Z" fill="${c.fg}" opacity=".85"/><circle cx="160" cy="62" r="12" fill="${c.fg}"/>${T(160, 192, 11, c.fg, f.d, "Annunciation", 'text-anchor="middle" font-style="italic"')}`,
    panel: (c, f) => `<rect x="14" y="14" width="140" height="172" fill="${c.sur}"/>${T(26, 70, 54, c.fg, f.d, "03", 'font-weight="600"')}${T(26, 96, 13, c.fg, f.t, "The Desert City")}${L(4, 26, 108, 110, 8, 3, c.fg)}<rect x="174" y="40" width="132" height="2" fill="${c.fg}"/>${[0, 1, 2, 3].map((i) => `<circle cx="${184 + i * 38}" cy="41" r="4" fill="${c.acc}"/>${T(176 + i * 38, 60, 9, c.fg, f.t, 1880 + i * 40)}`).join("")}`,

  let uid = 0;
  function preview(style, palette) {
    const c = roles(palette);
    const fm = { d: FONTS[style.preview.display] || FONTS.grotesk, t: FONTS[style.preview.text] || FONTS.grotesk };
    const draw = R[style.preview.renderer] || R.editorial;
    // Gradient and pattern ids must be unique per preview, or url(#id) resolves to another card's colors.
    const n = ++uid;
    const art = draw(c, fm, palette).replace(/id="([\w-]+)"/g, `id="$1-${n}"`).replace(/url\(#([\w-]+)\)/g, `url(#$1-${n})`);
    return `<svg viewBox="0 0 320 200" role="img" aria-label="Synthetic preview of ${esc(style.name)} using the ${esc(palette.name)} palette" preserveAspectRatio="xMidYMid slice"><rect width="320" height="200" fill="${c.bg}"/>${art}</svg>`;
  }

  // ---------- data ----------
  async function load() {
    try {
      const [s, p, r] = await Promise.all(["styles.json", "palettes.json", "presets.json"].map((f) => fetch(f).then((x) => { if (!x.ok) throw new Error(f); return x.json(); })));
      DB = { ...s, palettes: p.palettes, pcats: p.categories, presets: r.presets };
      DB.pal = Object.fromEntries(DB.palettes.map((x) => [x.id, x]));
      DB.sty = Object.fromEntries(DB.styles.map((x) => [x.id, x]));
      DB.cat = Object.fromEntries(DB.categories.map((x) => [x.id, x]));
      init();
    } catch (e) {
      $("#style-grid").innerHTML = `<div class="notice"><strong>Library data could not load.</strong> Browsers block reading local files, so serve this folder first:<br><code>cd skills/productivity/visual-style/library &amp;&amp; python3 -m http.server 8000</code><br>then open <code>http://localhost:8000/gallery.html</code>.</div>`;
    }
  }

  function opts(sel, values, label) {
    sel.innerHTML = `<option value="">${label}</option>` + values.map(([v, t]) => `<option value="${esc(v)}">${esc(t)}</option>`).join("");
  }
  const uniq = (key) => [...new Set(DB.styles.flatMap((s) => s[key]))].sort();

  function init() {
    $("#counts").textContent = `${DB.styles.length} styles · ${DB.palettes.length} palettes · ${DB.presets.length} presets`;
    opts($("#f-category"), DB.categories.map((c) => [c.id, c.name]), "All");
    opts($("#f-color"), [...DB.pcats.map((c) => ["cat:" + c.id, c.name + " (family)"]), ...DB.palettes.map((p) => ["pal:" + p.id, p.name])], "Any");
    opts($("#f-mood"), uniq("mood").map((v) => [v, v]), "Any");
    opts($("#f-typography"), DB.vocabulary.typography_tags.map((v) => [v, v]), "Any");
    opts($("#f-layout"), DB.vocabulary.layout_tags.map((v) => [v, v]), "Any");
    opts($("#f-medium"), DB.vocabulary.medium.map((v) => [v, v]), "Any");
    opts($("#f-use"), uniq("use_cases").map((v) => [v, v]), "Any");
    opts($("#f-motion"), DB.vocabulary.motion_type.map((v) => [v, v]), "Any");
    opts($("#p-category"), DB.pcats.map((c) => [c.id, c.name]), "All");
    try { const saved = JSON.parse(localStorage.getItem("vsl-filters") || "{}"); for (const [k, v] of Object.entries(saved)) { const el = $("#" + k); if (el) el.value = v; } } catch (e) {}
    document.querySelectorAll("#filters input, #filters select").forEach((el) => el.addEventListener("input", renderStyles));
    $("#reset").addEventListener("click", () => { document.querySelectorAll("#filters input, #filters select").forEach((el) => (el.value = "")); renderStyles(); });
    $("#p-text").addEventListener("input", renderPalettes);
    $("#p-category").addEventListener("input", renderPalettes);
    document.querySelectorAll("nav.tabs button").forEach((b) => b.addEventListener("click", () => setTab(b.dataset.tab)));
    setupChecker();
    renderStyles(); renderPalettes(); renderPresets();
    const h = location.hash.slice(1);
    if (["styles", "palettes", "presets"].includes(h)) setTab(h);
    else if (DB.sty[h]) openStyle(h);
  }

  function setTab(t) {
    state.tab = t;
    document.querySelectorAll("nav.tabs button").forEach((b) => b.setAttribute("aria-selected", String(b.dataset.tab === t)));
    for (const v of ["styles", "palettes", "presets"]) $("#view-" + v).hidden = v !== t;
  }

  // ---------- styles ----------
  function styleMatches(s) {
    const v = (id) => $(id).value;
    const q = v("#f-text").trim().toLowerCase();
    if (q) { const blob = [s.id, s.name, s.summary, ...s.aliases, ...s.mood, ...s.use_cases].join(" ").toLowerCase(); if (!q.split(/\s+/).every((w) => blob.includes(w))) return false; }
    if (v("#f-category") && s.category !== v("#f-category")) return false;
    const col = v("#f-color");
    if (col.startsWith("pal:") && !s.compatible_palettes.includes(col.slice(4))) return false;
    if (col.startsWith("cat:") && !s.compatible_palettes.some((p) => DB.pal[p].category === col.slice(4))) return false;
    for (const [id, key] of [["#f-mood", "mood"], ["#f-typography", "typography_tags"], ["#f-layout", "layout_tags"], ["#f-medium", "medium"], ["#f-use", "use_cases"], ["#f-motion", "motion_type"]]) {
      if (v(id) && !s[key].includes(v(id))) return false;
    }
    return true;
  }
  function paletteFor(s) {
    const col = $("#f-color").value;
    if (state.paletteOverride[s.id]) return DB.pal[state.paletteOverride[s.id]];
    if (col.startsWith("pal:")) return DB.pal[col.slice(4)];
    if (col.startsWith("cat:")) { const m = s.compatible_palettes.find((p) => DB.pal[p].category === col.slice(4)); if (m) return DB.pal[m]; }
    return DB.pal[s.preview.palette] || DB.pal[s.compatible_palettes[0]];
  }
  const swatchBar = (p) => `<div class="swatches" title="${esc(p.name)}">${p.colors.map((c) => `<span style="background:${c.hex};flex:${c.share}" title="${esc(c.name)} ${c.hex} (${c.role})"></span>`).join("")}</div>`;

  function renderStyles() {
    const keep = {};
    document.querySelectorAll("#filters input, #filters select").forEach((el) => { if (el.value) keep[el.id] = el.value; });
    try { localStorage.setItem("vsl-filters", JSON.stringify(keep)); } catch (e) {}
    const list = DB.styles.filter(styleMatches);
    $("#style-count").textContent = `${list.length} of ${DB.styles.length} styles`;
    $("#style-grid").innerHTML = list.length ? list.map((s) => {
      const p = paletteFor(s);
      const fd = FONTS[s.preview.display] || FONTS.grotesk, ft = FONTS[s.preview.text] || FONTS.grotesk;
      return `<article class="card">
        <div class="thumb">${preview(s, p)}<span class="tag-synth">synthetic preview</span></div>
        <div class="body">
          <div class="eyebrow">${esc(DB.cat[s.category].name)}</div>
          <h3>${esc(s.name)}</h3>
          ${swatchBar(p)}
          <div class="specimen"><span class="d" style="font-family:${fd}">Aa</span><span class="t" style="font-family:${ft}">${esc(s.typography_tags.join(" + "))}</span></div>
          <p class="summary">${esc(s.summary)}</p>
          <div class="chips">${s.mood.map((m) => `<span class="chip">${esc(m)}</span>`).join("")}</div>
          <div class="actions"><button class="btn" data-detail="${s.id}">Details</button><button class="btn primary" data-use="${s.id}">Use this style</button></div>
        </div></article>`;
    }).join("") : `<p class="empty">No style matches every filter. Clear one filter, or search a single word.</p>`;
  }
  document.addEventListener("click", (e) => {
    const d = e.target.closest("[data-detail]"); if (d) return openStyle(d.dataset.detail);
    const u = e.target.closest("[data-use]"); if (u) return openUse(u.dataset.use);
    const sp = e.target.closest("[data-style-link]"); if (sp) return openStyle(sp.dataset.styleLink);
    const pp = e.target.closest("[data-preset]"); if (pp) return openPreset(pp.dataset.preset);
    if (e.target.closest("[data-close]")) $("#dlg").close();
  });

  const profileCache = {};
  async function profileSection(s) {
    if (!(s.profile in profileCache)) {
      try { profileCache[s.profile] = await fetch(s.profile).then((r) => (r.ok ? r.text() : "")); } catch (e) { profileCache[s.profile] = ""; }
    }
    const part = profileCache[s.profile].split(/^## /m).find((x) => x.split("\n")[0].trim() === s.id);
    if (!part) return `<p class="summary">Profile text not available here. Read <code>${esc(s.profile)}</code>, section <code>${esc(s.id)}</code>.</p>`;
    return part.split("\n").filter((l) => l.startsWith("**")).map((l) => {
      const m = l.match(/^\*\*(.+?):\*\*\s*(.*)$/); if (!m) return "";
      const body = esc(m[2]).replace(/`([^`]+)`/g, "<code>$1</code>");
      return `<div><h4>${esc(m[1])}</h4><p>${body}</p></div>`;
    }).join("");
  }
  function showDialog(html) { $("#dlg-body").innerHTML = html; const d = $("#dlg"); if (!d.open) d.showModal(); d.scrollTop = 0; }

  async function openStyle(id) {
    const s = DB.sty[id]; const p = paletteFor(s);
    const refs = s.reference_images.length ? s.reference_images.map((r) => `${esc(r.kind)}: ${esc(r.path)} (${esc(r.source)})`).join("<br>") : "None yet. Preview above is synthetic.";
    showDialog(`<header><div><div class="eyebrow">${esc(DB.cat[s.category].name)}</div><h2 id="dlg-title">${esc(s.name)}</h2></div><button class="btn" data-close>Close</button></header>
      <div class="thumb" style="border:1px solid var(--rule);border-radius:8px;overflow:hidden">${preview(s, p)}<span class="tag-synth">synthetic preview · ${esc(p.name)}</span></div>
      <p>${esc(s.summary)}</p>
      <dl class="meta">
        ${s.aliases.length ? `<dt>Also called</dt><dd>${esc(s.aliases.join(", "))}</dd>` : ""}
        <dt>Palettes</dt><dd>${s.compatible_palettes.map((pid) => `<button class="linkish" data-swap="${s.id}|${pid}">${esc(DB.pal[pid].name)}</button>`).join(", ")}</dd>
        <dt>Related</dt><dd>${s.related_styles.map((r) => `<button class="linkish" data-style-link="${r}">${esc(DB.sty[r].name)}</button>`).join(", ")}</dd>
        <dt>Medium</dt><dd>${esc(s.medium.join(", "))}</dd>
        <dt>Use cases</dt><dd>${esc(s.use_cases.join(", "))}</dd>
        <dt>Motion</dt><dd>${esc(s.motion_type.join(", "))}</dd>
        <dt>References</dt><dd>${refs}</dd>
        ${s.reference_sources.length ? `<dt>Sources</dt><dd>${s.reference_sources.map(esc).join("<br>")}</dd>` : ""}
        <dt>Id</dt><dd><code>${esc(s.id)}</code></dd>
      </dl>
      <div class="actions"><button class="btn primary" data-use="${s.id}">Use this style</button></div>
      <div class="profile" id="profile">Loading profile…</div>`);
    $("#profile").innerHTML = await profileSection(s);
  }
  document.addEventListener("click", (e) => {
    const sw = e.target.closest("[data-swap]"); if (!sw) return;
    const [sid, pid] = sw.dataset.swap.split("|"); state.paletteOverride[sid] = pid; renderStyles(); openStyle(sid);
  });

  function tokens(p) {
    const used = {};
    return p.colors.map((c) => { used[c.role] = (used[c.role] || 0) + 1; const n = used[c.role] > 1 ? `${c.role}-${used[c.role]}` : c.role; return `  --color-${n}: ${c.hex}; /* ${c.name} */`; }).join("\n");
  }
  function openUse(id) {
    const s = DB.sty[id]; const current = paletteFor(s).id;
    const others = DB.palettes.filter((p) => !s.compatible_palettes.includes(p.id));
    showDialog(`<header><div><div class="eyebrow">Use this style</div><h2 id="dlg-title">${esc(s.name)}</h2></div><button class="btn" data-close>Close</button></header>
      <div class="row"><label for="use-pal">Palette</label><select id="use-pal">
        <optgroup label="Compatible">${s.compatible_palettes.map((pid) => `<option value="${pid}" ${pid === current ? "selected" : ""}>${esc(DB.pal[pid].name)}</option>`).join("")}</optgroup>
        <optgroup label="Other (check fit)">${others.map((p) => `<option value="${p.id}" ${p.id === current ? "selected" : ""}>${esc(p.name)}</option>`).join("")}</optgroup>
      </select></div>
      <div id="use-out"></div>`);
    const draw = () => {
      const p = DB.pal[$("#use-pal").value]; state.paletteOverride[s.id] = p.id;
      const fits = s.compatible_palettes.includes(p.id);
      const snippet = `/visual-style\nStyle: ${s.id}\nPalette: ${p.id}${fits ? "" : "  (outside the style's compatible list: confirm fit)"}\n\n:root {\n${tokens(p)}\n}`;
      $("#use-out").innerHTML = `<div class="thumb" style="border:1px solid var(--rule);border-radius:8px;overflow:hidden;margin-bottom:12px">${preview(s, p)}<span class="tag-synth">synthetic preview</span></div>
        <pre class="snippet" id="snip">${esc(snippet)}</pre>
        <div class="row" style="margin-top:10px"><button class="btn primary" id="copy">Copy selection</button><span class="copied" id="copied" aria-live="polite"></span></div>
        <p class="summary">Paste this into a Claude Code session to start <code>/visual-style</code> with this pair, or use the tokens directly in CSS.</p>`;
      $("#copy").addEventListener("click", () => copy(snippet));
      renderStyles();
    };
    $("#use-pal").addEventListener("input", draw); draw();
  }
  function copy(text) {
    const done = (m) => { const el = $("#copied"); if (el) el.textContent = m; };
    try {
      navigator.clipboard.writeText(text).then(() => done("Copied"), () => { selectSnippet(); done("Copy blocked here: text selected, press Ctrl or Cmd + C"); });
    } catch (e) { selectSnippet(); done("Text selected, press Ctrl or Cmd + C"); }
  }
  function selectSnippet() { const el = $("#snip"); if (!el) return; const r = document.createRange(); r.selectNodeContents(el); const s = getSelection(); s.removeAllRanges(); s.addRange(r); }

  // ---------- palettes ----------
  const pairColor = (p, n) => p.colors.find((c) => c.name === n || c.role === n);
  function renderPalettes() {
    const q = $("#p-text").value.trim().toLowerCase(), cat = $("#p-category").value;
    const list = DB.palettes.filter((p) => (!cat || p.category === cat) && (!q || [p.id, p.name, ...p.mood, ...p.colors.map((c) => c.name + " " + c.hex)].join(" ").toLowerCase().includes(q)));
    $("#palette-count").textContent = `${list.length} of ${DB.palettes.length} palettes`;
    $("#palette-grid").innerHTML = list.map((p) => {
      const styles = DB.styles.filter((s) => s.compatible_palettes.includes(p.id));
      const pairs = p.text_pairs.map((t) => { const fg = pairColor(p, t.fg), bg = pairColor(p, t.bg), r = ratio(fg.hex, bg.hex);
        const warn = r < THRESH[t.use] ? `<span class="badge bad">below ${THRESH[t.use]}</span>` : badge(r, t.use);
        return `<div class="pair"><span class="demo" style="background:${bg.hex};color:${fg.hex}">Aa</span><span>${esc(fg.name)} on ${esc(bg.name)} <span class="role">· ${t.use}</span></span>${warn}</div>`; }).join("");
      const avoid = p.avoid_pairs.map((t) => { const fg = pairColor(p, t.fg), bg = pairColor(p, t.bg), r = ratio(fg.hex, bg.hex);
        return `<div class="pair"><span class="demo" style="background:${bg.hex};color:${fg.hex}">Aa</span><span>Avoid: ${esc(fg.name)} on ${esc(bg.name)}</span><span class="badge bad">${r.toFixed(2)}</span></div>`; }).join("");
      return `<article class="card pcard">
        <div class="bar">${p.colors.map((c) => `<span style="background:${c.hex};flex:${c.share}" title="${esc(c.name)} ~${c.share}%"></span>`).join("")}</div>
        <div class="body">
          <div class="eyebrow">${esc(DB.pcats.find((c) => c.id === p.category).name)} · ${esc(p.source)}</div>
          <h3>${esc(p.name)}</h3>
          <div class="colors">${p.colors.map((c) => `<div><i style="background:${c.hex}"></i><code>${c.hex}</code><span>${esc(c.name)}</span><span class="role">${c.role} ~${c.share}%</span></div>`).join("")}</div>
          <div class="eyebrow">Readable text</div><div class="pairs">${pairs}${avoid}</div>
          <p class="summary">${esc(p.contrast_notes)}</p>
          <p class="summary"><strong>Example.</strong> ${esc(p.example)}</p>
          <div class="chips">${styles.map((s) => `<button class="chip linkish" data-style-link="${s.id}">${esc(s.name)}</button>`).join("")}</div>
        </div></article>`;
    }).join("");
  }
  function setupChecker() {
    const fg = $("#c-fg"), bg = $("#c-bg"), fp = $("#c-fg-pick"), bp = $("#c-bg-pick");
    const valid = (v) => /^#[0-9a-f]{6}$/i.test(v);
    const upd = () => {
      if (!valid(fg.value) || !valid(bg.value)) { $("#c-result").textContent = "Enter colors as #RRGGBB"; return; }
      const r = ratio(fg.value, bg.value);
      $("#c-sample").style.color = fg.value; $("#c-sample").style.background = bg.value;
      $("#c-result").innerHTML = badge(r) + (r < 4.5 ? ` <span class="badge bad">Warning: not readable as body text</span>` : "");
    };
    fp.addEventListener("input", () => { fg.value = fp.value.toUpperCase(); upd(); });
    bp.addEventListener("input", () => { bg.value = bp.value.toUpperCase(); upd(); });
    fg.addEventListener("input", () => { if (valid(fg.value)) fp.value = fg.value; upd(); });
    bg.addEventListener("input", () => { if (valid(bg.value)) bp.value = bg.value; upd(); });
    upd();
  }

  // ---------- presets ----------
  function renderPresets() {
    $("#preset-grid").innerHTML = DB.presets.map((pr) => {
      const s = DB.sty[pr.primary_style], p = DB.pal[pr.palette];
      return `<article class="card">
        <div class="thumb">${preview(s, p)}<span class="tag-synth">synthetic preview</span></div>
        <div class="body">
          <div class="eyebrow">Preset</div><h3>${esc(pr.name)}</h3>
          ${swatchBar(p)}
          <p class="summary">${esc(pr.summary)}</p>
          <dl class="meta" style="display:grid;grid-template-columns:max-content 1fr;gap:2px 10px;font-size:13px;margin:0">
            <dt class="role">primary</dt><dd style="margin:0"><button class="linkish" data-style-link="${s.id}">${esc(s.name)}</button></dd>
            <dt class="role">secondary</dt><dd style="margin:0">${pr.secondary_styles.map((x) => `<button class="linkish" data-style-link="${x}">${esc(DB.sty[x].name)}</button>`).join(", ")}</dd>
            <dt class="role">palette</dt><dd style="margin:0">${esc(p.name)} <span class="role">or ${esc(pr.alt_palettes.map((x) => DB.pal[x].name).join(", "))}</span></dd>
          </dl>
          <div class="actions"><button class="btn primary" data-preset="${pr.id}">Use preset</button></div>
        </div></article>`;
    }).join("");
  }
  function openPreset(id) {
    const pr = DB.presets.find((x) => x.id === id), p = DB.pal[pr.palette];
    const d = pr.direction;
    const snippet = `/visual-style\nPreset: ${pr.id}\nStyle: ${pr.primary_style}${pr.secondary_styles.length ? " + " + pr.secondary_styles.join(", ") : ""}\nPalette: ${pr.palette}\nAdjust: ${pr.adjustable.join(", ")}\n\n:root {\n${tokens(p)}\n}`;
    showDialog(`<header><div><div class="eyebrow">Preset</div><h2 id="dlg-title">${esc(pr.name)}</h2></div><button class="btn" data-close>Close</button></header>
      <p>${esc(pr.summary)}</p><p class="summary">${esc(pr.secondary_role)}</p>
      <div class="profile">${["typography", "composition", "image_treatment", "motion"].map((k) => `<div><h4>${k.replace("_", " ")}</h4><p>${esc(d[k])}</p></div>`).join("")}<div><h4>avoid</h4><p>${esc(d.avoid.join("; "))}</p></div></div>
      <pre class="snippet" id="snip">${esc(snippet)}</pre>
      <div class="row"><button class="btn primary" id="copy">Copy selection</button><span class="copied" id="copied" aria-live="polite"></span></div>`);
    $("#copy").addEventListener("click", () => copy(snippet));
  }

  load();
})();
</script>
</body>
</html>
